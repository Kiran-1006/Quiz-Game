<!DOCTYPE html>
<html>
    <head>
        <title>
            Quiz Game
        </title>
        <link rel="icon" type="text/icon" href="https://static.vecteezy.com/system/resources/thumbnails/010/784/649/small_2x/yellow-abstract-lamp-and-question-mark-logo-creative-logo-idea-concept-logo-concept-vector.jpg">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div id="question-container" class="hide">
                <div id="answer-buttons" class="button">
                    <button class="btn">Answer 1</button>
                    <button class="btn">Answer 2</button>
                    <button class="btn">Answer 3</button>
                    <button class="btn">Answer 4</button>
                </div>
            </div>
        
            <div class="controls">
                <button id="start-btn" class="start-button btn">Start</button>
                <button id="next-btn" class="next-button btn hide">Next</button>
            </div>
        </div>

            <div class="score">
                <span id="right-answers"></span>
            </div>
        
        <script src="script.js"></script>
    </body>
</html>
